spring.application.name=microservicio-tarifa
server.port=8092


# DataSource SQLite
spring.datasource.url=jdbc:sqlite:./database/bd_tp.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA - Hibernate creará las tablas automáticamente
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivar consola H2
spring.h2.console.enabled=false

# Desactivar inicialización de scripts SQL (usamos JPA para crear tablas)
spring.sql.init.mode=never

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
