spring.application.name=Gateway
server.port=8080

# Direcciones de los microservicios para Docker (usar nombres de contenedores)
uri.ms-rutas=http://localhost:8095
uri.ms-solicitudes=http://localhost:8090
uri.ms-camiones=http://localhost:8085
uri.ms-tarifas=http://localhost:8092

# ====================================
# ? CONFIGURACIÓN DE KEYCLOAK
# ====================================

# URL del servidor Keycloak (ajustar según tu configuración)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/bda-realm

# JWK Set URI para validar tokens JWT
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/bda-realm/protocol/openid-connect/certs

# Habilitar logs para debugging (opcional, comentar en producción)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
