spring.application.name=microservicio-solicitudes
server.port=8090

# conexion rutas (Para Docker usar nombre del contenedor)
api.rutas.base-url=http://localhost:8095/api/rutas

# DataSource SQLite
spring.datasource.url=jdbc:sqlite:./database/bd_tp.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA - NO tocar la estructura, solo validar
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Desactivar consola H2
spring.h2.console.enabled=false

# Inicialización de datos - DESACTIVADA (ya que no existen los archivos .sql)
spring.sql.init.mode=never
