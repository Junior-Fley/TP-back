spring.application.name=microservicio-solicitudes
server.port=8090

# conexion rutas
api.rutas.base-url=http://localhost:8093/api/rutas

spring.h2.console.enabled=true

# DataSource H2
spring.datasource.url=jdbc:h2:mem:solicitud;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# Forzar inicialización del script personalizado
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:solicitud_data.sql
