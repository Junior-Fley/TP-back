services:
  ms-rutas:
    build: ./ms-Rutas
    container_name: ms_rutas
    ports:
      - "8095:8095"
    environment:
      SERVER_PORT: 8095
    volumes:
      - ./database:/app/database
    networks:
      - app-net

  ms-solicitudes:
    build: ./ms-Solicitudes
    container_name: ms_solicitudes
    ports:
      - "8090:8090"
    restart: always
    volumes:
      - ./database:/app/database
    depends_on:
      - ms-rutas
    networks:
      - app-net

  ms-flota:
    build: ms-Flotas
    container_name: ms_flota
    ports:
      - "8085:8085"
    volumes:
      - ./database:/app/database
    networks:
      - app-net

  ms-tarifas:
    build: ms-tarifas
    container_name: ms_tarifas
    ports:
      - "8092:8085"
    volumes:
      - ./database:/app/database
    networks:
      - app-net

  api-gateway:
    build: ./Gateway
    container_name: api_gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - ms-rutas
      - ms-solicitudes
      - ms-flota
    networks:
      - app-net

networks:
  app-net:
    driver: bridge