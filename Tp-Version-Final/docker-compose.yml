services:
  # ======================================
  # Base de Datos PostgreSQL
  # ======================================
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================================
  # PgAdmin
  # ======================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - app-net

  # ======================================
  # Keycloak - Seguridad
  # ======================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: keycloak
    command:
      - start-dev
      - --import-realm
    ports:
      - "8081:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin123
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
    volumes:
      - ./seguridad-keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - keycloak_data:/opt/keycloak/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ======================================
  # Microservicio Transporte
  # ======================================
  ms-transporte:
    build:
      context: .
      dockerfile: ms-Transporte/Dockerfile
    container_name: ms-transporte
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    restart: on-failure

  # ======================================
  # Microservicio Rutas
  # ======================================
  ms-rutas:
    build:
      context: .
      dockerfile: ms-Rutas/Dockerfile
    container_name: ms-rutas
    ports:
      - "8095:8095"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - app-net
    depends_on:
      postgres:
        condition: service_healthy
      ms-transporte:
        condition: service_started
      keycloak:
        condition: service_healthy
    restart: on-failure

  # ======================================
  # Microservicio Solicitudes
  # ======================================
  ms-solicitudes:
    build:
      context: .
      dockerfile: ms-Solicitudes/Dockerfile
    container_name: ms-solicitudes
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      postgres:
        condition: service_healthy
      ms-rutas:
        condition: service_started
      keycloak:
        condition: service_healthy
    networks:
      - app-net
    restart: on-failure

  # ======================================
  # API Gateway
  # ======================================
  api-gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - ms-rutas
      - ms-solicitudes
      - ms-transporte
    networks:
      - app-net
    restart: on-failure

# ======================================
# Volúmenes persistentes
# ======================================
volumes:
  pgdata:
  pgadmin:
  keycloak_data:

# ======================================
# Red compartida
# ======================================
networks:
  app-net:
    driver: bridge