spring.application.name=microservicio-solicitudes
server.port=8090

# conexion rutas (nombre del contenedor)
api.rutas.base-url=http://ms-rutas:8095/api/rutas

# DataSource PostgreSQL
spring.datasource.url=jdbc:postgresql://postgres:5432/admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=admin
spring.datasource.password=admin

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Desactivar consola H2
spring.h2.console.enabled=false

# Inicialización de datos
spring.sql.init.mode=never

# KEYCLOAK con nombre de contenedor
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/bda-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/bda-realm/protocol/openid-connect/certs

# Habilitar logs para debugging
logging.level.org.springframework.security=DEBUG
